<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="templeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#templeGradient)"/>

  <!-- 地面 -->
  <rect x="0" y="220" width="400" height="80" fill="#D2B48C" opacity="0.4"/>

  <!-- 寺庙主体 -->
  <rect x="100" y="150" width="200" height="90" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>

  <!-- 屋顶第一层 -->
  <path d="M 80 150 L 200 110 L 320 150 L 310 155 L 200 120 L 90 155 Z" fill="#FF6347" stroke="#DC143C" stroke-width="2"/>

  <!-- 屋顶第二层 -->
  <path d="M 90 170 L 200 135 L 310 170 L 300 175 L 200 145 L 100 175 Z" fill="#FF7F50" stroke="#DC143C" stroke-width="2"/>

  <!-- 门 -->
  <rect x="170" y="190" width="60" height="50" fill="#8B0000" stroke="#654321" stroke-width="2"/>

  <!-- 门上的装饰 -->
  <circle cx="200" cy="215" r="8" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>

  <!-- 柱子 -->
  <rect x="110" y="150" width="15" height="90" fill="#A0522D"/>
  <rect x="275" y="150" width="15" height="90" fill="#A0522D"/>

  <!-- 窗户 -->
  <rect x="120" y="170" width="25" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="255" y="170" width="25" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>

  <!-- 屋顶装饰 -->
  <circle cx="200" cy="110" r="8" fill="#FFD700"/>
</svg>
