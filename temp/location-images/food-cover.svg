<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bowlGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6347;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="#FFF8DC" opacity="0.5"/>

  <!-- 碗的阴影 -->
  <ellipse cx="200" cy="220" rx="100" ry="20" fill="#000" opacity="0.1"/>

  <!-- 碗 -->
  <ellipse cx="200" cy="200" rx="90" ry="20" fill="#DC143C"/>
  <path d="M 110 200 Q 110 240 200 250 Q 290 240 290 200" fill="#FF6347" stroke="#DC143C" stroke-width="2"/>

  <!-- 汤面 -->
  <ellipse cx="200" cy="200" rx="85" ry="18" fill="#FFD700" opacity="0.8"/>

  <!-- 面条 -->
  <path d="M 150 190 Q 160 200 170 190 T 190 190" stroke="#F4A460" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M 180 195 Q 190 205 200 195 T 220 195" stroke="#F4A460" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M 210 190 Q 220 200 230 190 T 250 190" stroke="#F4A460" stroke-width="4" fill="none" opacity="0.9"/>

  <!-- 葱花 -->
  <rect x="170" y="185" width="3" height="8" fill="#228B22" opacity="0.8"/>
  <rect x="200" y="188" width="3" height="8" fill="#228B22" opacity="0.8"/>
  <rect x="230" y="186" width="3" height="8" fill="#228B22" opacity="0.8"/>

  <!-- 筷子 -->
  <rect x="250" y="150" width="6" height="100" fill="#8B4513" rx="3" transform="rotate(-30 253 200)"/>
  <rect x="260" y="150" width="6" height="100" fill="#A0522D" rx="3" transform="rotate(-25 263 200)"/>
</svg>
