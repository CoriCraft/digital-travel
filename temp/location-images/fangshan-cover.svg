<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C2C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 天空背景 -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>

  <!-- 远山 -->
  <path d="M 0 180 Q 100 140 200 160 T 400 150 L 400 300 L 0 300 Z" fill="#6B8E5C" opacity="0.6"/>

  <!-- 中山 -->
  <path d="M 0 200 Q 80 160 160 180 T 320 170 Q 360 180 400 170 L 400 300 L 0 300 Z" fill="#4A7C2C" opacity="0.8"/>

  <!-- 近山 -->
  <path d="M 0 220 Q 100 180 200 200 T 400 190 L 400 300 L 0 300 Z" fill="url(#mountainGradient)"/>

  <!-- 太阳 -->
  <circle cx="320" cy="80" r="30" fill="#FFD700" opacity="0.8"/>

  <!-- 云朵 -->
  <ellipse cx="80" cy="60" rx="30" ry="15" fill="white" opacity="0.7"/>
  <ellipse cx="100" cy="55" rx="35" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="120" cy="60" rx="30" ry="15" fill="white" opacity="0.7"/>
</svg>
