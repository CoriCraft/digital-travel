<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#skyBg)"/>

  <!-- 地面 -->
  <rect x="0" y="220" width="400" height="80" fill="#8FBC8F" opacity="0.4"/>

  <!-- 房屋主体 -->
  <rect x="120" y="140" width="160" height="100" fill="#DEB887" stroke="#8B7355" stroke-width="2"/>

  <!-- 屋顶 -->
  <path d="M 100 140 L 200 80 L 300 140 Z" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>

  <!-- 门 -->
  <rect x="180" y="190" width="40" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <circle cx="210" cy="215" r="3" fill="#FFD700"/>

  <!-- 窗户 -->
  <rect x="140" y="160" width="30" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="155" y1="160" x2="155" y2="190" stroke="#4682B4" stroke-width="2"/>
  <line x1="140" y1="175" x2="170" y2="175" stroke="#4682B4" stroke-width="2"/>

  <rect x="230" y="160" width="30" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="245" y1="160" x2="245" y2="190" stroke="#4682B4" stroke-width="2"/>
  <line x1="230" y1="175" x2="260" y2="175" stroke="#4682B4" stroke-width="2"/>

  <!-- 烟囱 -->
  <rect x="240" y="100" width="20" height="40" fill="#8B4513"/>
  <ellipse cx="250" cy="100" rx="10" ry="5" fill="#654321"/>
</svg>
