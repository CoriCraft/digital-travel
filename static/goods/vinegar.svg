<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A2511;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#6B3410;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#4A2511;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4A0000;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- 装饰性谷物图案 -->
  <circle cx="80" cy="80" r="15" fill="#D2691E" opacity="0.3"/>
  <circle cx="320" cy="100" r="12" fill="#D2691E" opacity="0.3"/>
  <circle cx="100" cy="320" r="18" fill="#D2691E" opacity="0.3"/>
  <circle cx="300" cy="300" r="14" fill="#D2691E" opacity="0.3"/>

  <!-- 醋瓶主体 -->
  <g transform="translate(200, 200)">
    <!-- 瓶身 -->
    <path d="M -60 -80 L -60 80 Q -60 100 -40 100 L 40 100 Q 60 100 60 80 L 60 -80 Z"
          fill="url(#bottleGrad)" stroke="#2A1508" stroke-width="2"/>

    <!-- 液体 -->
    <path d="M -55 -20 L -55 75 Q -55 95 -38 95 L 38 95 Q 55 95 55 75 L 55 -20 Z"
          fill="url(#liquidGrad)"/>

    <!-- 瓶颈 -->
    <rect x="-30" y="-120" width="60" height="40" rx="5"
          fill="url(#bottleGrad)" stroke="#2A1508" stroke-width="2"/>

    <!-- 瓶盖 -->
    <rect x="-35" y="-135" width="70" height="15" rx="3"
          fill="#8B4513" stroke="#2A1508" stroke-width="2"/>

    <!-- 标签 -->
    <rect x="-50" y="-40" width="100" height="60" rx="5"
          fill="#FFF8DC" opacity="0.9" stroke="#8B4513" stroke-width="1"/>

    <!-- 标签文字 -->
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="16"
          font-weight="bold" fill="#8B0000" text-anchor="middle">老陈醋</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12"
          fill="#8B4513" text-anchor="middle">2.5L</text>

    <!-- 高光效果 -->
    <ellipse cx="-35" cy="-50" rx="15" ry="30" fill="url(#shine)"/>
    <ellipse cx="40" cy="0" rx="10" ry="40" fill="url(#shine)"/>

    <!-- 装饰性波纹 -->
    <path d="M -50 -25 Q -40 -30 -30 -25 T -10 -25 T 10 -25 T 30 -25 T 50 -25"
          stroke="#8B4513" stroke-width="1" fill="none" opacity="0.3"/>
  </g>

  <!-- 装饰性文字 -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="14"
        fill="#FFF8DC" text-anchor="middle" opacity="0.6">山西特产</text>
</svg>