<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8E6CF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCEDC1;stop-opacity:1" />
    </linearGradient>
    <pattern id="fabric" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#E8F5E9"/>
      <circle cx="5" cy="5" r="1" fill="#81C784"/>
      <circle cx="15" cy="15" r="1" fill="#81C784"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg2)" rx="20"/>

  <!-- 帆布包主体 -->
  <path d="M 120 150 L 280 150 L 290 320 Q 290 340 270 340 L 130 340 Q 110 340 110 320 Z"
        fill="url(#fabric)" stroke="#66BB6A" stroke-width="3"/>

  <!-- 包口 -->
  <rect x="120" y="140" width="160" height="20" fill="#C8E6C9" rx="5"/>

  <!-- 提手 -->
  <path d="M 150 140 Q 150 100 170 100 Q 190 100 190 140"
        fill="none" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 210 140 Q 210 100 230 100 Q 250 100 250 140"
        fill="none" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>

  <!-- 刺绣图案 - 花朵 -->
  <circle cx="200" cy="220" r="25" fill="#FF6B9D" opacity="0.8"/>
  <circle cx="185" cy="210" r="15" fill="#FF8FAB" opacity="0.8"/>
  <circle cx="215" cy="210" r="15" fill="#FF8FAB" opacity="0.8"/>
  <circle cx="185" cy="230" r="15" fill="#FF8FAB" opacity="0.8"/>
  <circle cx="215" cy="230" r="15" fill="#FF8FAB" opacity="0.8"/>
  <circle cx="200" cy="220" r="10" fill="#FFD93D"/>

  <!-- 刺绣图案 - 叶子 -->
  <ellipse cx="170" cy="250" rx="8" ry="15" fill="#4CAF50" opacity="0.8" transform="rotate(-30 170 250)"/>
  <ellipse cx="230" cy="250" rx="8" ry="15" fill="#4CAF50" opacity="0.8" transform="rotate(30 230 250)"/>

  <!-- 装饰线条 -->
  <path d="M 140 280 L 260 280" stroke="#81C784" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 140 300 L 260 300" stroke="#81C784" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
